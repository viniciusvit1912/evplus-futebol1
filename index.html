<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0f14;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    background: #111820;
    padding: 22px 16px;
    text-align: center;
    border-bottom: 1px solid #202a34;
}

header h1 {
    margin: 0;
    color: #00ff88;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
    color: #999;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 16px;
}

.card {
    background: #151d26;
    border: 1px solid #202a34;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
}

.card h2 {
    margin-top: 0;
}

label {
    display: block;
    margin: 13px 0 6px;
    color: #aaa;
}

input,
select {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #394550;
    background: #0b0f14;
    color: #fff;
    font-size: 16px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #00ff88;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 16px;
    margin-top: 18px;
    background: #00ff88;
    color: #06110b;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.08);
}

button:active {
    transform: scale(.98);
}

.status {
    font-weight: bold;
    color: #ffd166;
}

.status.online {
    color: #00ff88;
}

.status.error {
    color: #ff5555;
}

.resultado {
    line-height: 1.8;
}

.positivo {
    color: #00ff88;
    font-weight: bold;
}

.negativo {
    color: #ff5555;
    font-weight: bold;
}

.aguarda {
    color: #ffd166;
    font-weight: bold;
}

.badge {
    display: inline-block;
    background: #202a34;
    border-radius: 8px;
    padding: 8px 12px;
    margin: 8px 0;
    font-weight: bold;
}

.info {
    color: #999;
    font-size: 13px;
    line-height: 1.6;
}

.historico-item {
    border-top: 1px solid #303942;
    padding: 14px 0;
    line-height: 1.7;
}

.vazio {
    color: #888;
}

.erro-api {
    color: #ff7777;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
}

@media (max-width: 600px) {
    .grid {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 24px;
    }
}
</style>
</head>

        <option value="Over/Under gols">

            Ambas marcam

<script>

/* =====================================================
   FUNÇÃO PARA PEGAR NÚMEROS
===================================================== */

function numero(id) {

    const elemento =
        document.getElementById(id);

    if (!elemento) {
        return null;
    }

    const valor =
        elemento.value.trim();

    if (valor === "") {
        return null;
    }

    const numeroConvertido =
        Number(valor);

    if (!Number.isFinite(numeroConvertido)) {
        return null;
    }

    return numeroConvertido;
}


/* =====================================================
   TESTAR API
===================================================== */

async function testarAPI() {

    const status =
        document.getElementById("status");

    try {

        const resposta =
            await fetch("/api");

        if (!resposta.ok) {
            throw new Error(
                "API respondeu com erro: " +
                resposta.status
            );
        }

        const dados =
            await resposta.json();

        if (dados.status === "online") {

            status.className =
                "status online";

            status.textContent =
                "● API funcionando";

        } else {

            throw new Error(
                "Resposta inesperada da API"
            );

        }

    } catch (erro) {

        status.className =
            "status error";

        status.textContent =
            "● Erro na API";

        console.error(
            "Erro ao conectar com a API:",
            erro
        );
    }
}


/* =====================================================
   ANALISAR EV
===================================================== */

async function analisarEV() {

    const resultado =
        document.getElementById("resultado");

    const odd =
        numero("odd");

    if (odd === null || odd <= 1) {

        resultado.innerHTML =
            '<span class="negativo">' +
            'Informe uma odd válida.' +
            '</span>';

        return;
    }

    const probabilidade =
        prompt(
            "Digite a probabilidade estimada (%)"
        );

    if (probabilidade === null) {
        return;
    }

    const prob =
        Number(probabilidade);

    if (!Number.isFinite(prob) ||
        prob <= 0 ||
        prob > 100) {

        resultado.innerHTML =
            '<span class="negativo">' +
            'Probabilidade inválida.' +
            '</span>';

        return;
    }

    try {

        const resposta =
            await fetch("/api", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    probabilidade: prob,
                    odd: odd
                })
            });

        const dados =
            await resposta.json();

        if (!resposta.ok) {
            throw new Error(
                dados.mensagem ||
                "Erro na API"
            );
        }

        const ev =
            dados.ev;

        let classe =
            "aguarda";

        let decisao =
            "🟡 AGUARDA";

        if (ev > 5) {

            classe =
                "positivo";

            decisao =
                "🟢 ENTRA";

        } else if (ev < 0) {

            classe =
                "negativo";

            decisao =
                "🔴 PASSA";
        }

        resultado.innerHTML =

            "<strong>Veredito:</strong> " +
            '<span class="' +
            classe +
            '">' +
            decisao +
            "</span><br><br>" +

            "<strong>Probabilidade:</strong> " +
            prob + "%<br>" +

            "<strong>Odd:</strong> " +
            odd.toFixed(2) + "<br>" +

            "<strong>Probabilidade implícita:</strong> " +
            (100 / odd).toFixed(2) +
            "%<br>" +

            "<strong>EV:</strong> " +
            ev.toFixed(2) +
            "%<br>" +

            "<strong>Odd justa:</strong> " +
            dados.valor_justo;

    } catch (erro) {

        resultado.innerHTML =
            '<span class="erro-api">' +
            "Erro ao consultar a API: " +
            erro.message +
            "</span>";
    }
}


/* =====================================================
   BOTÃO ANALISAR
===================================================== */

document
    .getElementById("analisar")
    .addEventListener(
        "click",
        analisarEV
    );


/* =====================================================
   INICIAR TESTE DA API
===================================================== */

testarAPI();
