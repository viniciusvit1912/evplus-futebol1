<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EV+ Futebol — Motor Estatístico</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
}

header {
    background: #111820;
    padding: 24px 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    color: #00ff88;
    font-size: 28px;
}

header p {
    color: #aaa;
    margin-bottom: 0;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 18px;
}

.card {
    background: #151d26;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 13px;
    margin-bottom: 6px;
    color: #bbb;
}

input,
select {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #0b0f14;
    color: white;
    font-size: 16px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: 0;
    border-radius: 8px;
    background: #00ff88;
    color: #07100b;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.status {
    color: #00ff88;
    font-weight: bold;
}

.resultado {
    line-height: 1.9;
}

.positivo {
    color: #00ff88;
    font-weight: bold;
}

.negativo {
    color: #ff5555;
    font-weight: bold;
}

.aguarda {
    color: #ffd166;
    font-weight: bold;
}

.badge {
    display: inline-block;
    padding: 8px 12px;
    margin: 5px 0;
    border-radius: 8px;
    background: #202a34;
    font-weight: bold;
}

.info {
    color: #999;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 10px;
}

.historico-item {
    border-top: 1px solid #333;
    padding: 15px 0;
    line-height: 1.7;
}

.vazio {
    color: #999;
}

@media (max-width: 600px) {

    .grid {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<header>

<h1>⚽ EV+ FUTEBOL</h1>

<p>Professional Strategic Betting Analyst</p>

</header>


<div class="container">


<!-- STATUS DA API -->

<div class="card">

<h2>📡 Sistema</h2>

<div id="status" class="status">
● Verificando API...
</div>

</div>


<!-- PARTIDA -->

<div class="card">

<h2>⚽ Partida</h2>

<label>Time da casa</label>

<input
    id="casa"
    type="text"
    placeholder="Ex: Flamengo"
>

<label>Time visitante</label>

<input
    id="visitante"

    placeholder="Ex: Palmeiras"
>

<label>Mercado</label>

<select id="mercado">

<option value="">Selecione</option>

<option>Resultado</option>
<option>Dupla chance</option>
<option>DNB</option>
<option>Over/Under gols</option>
<option>Ambas marcam</option>
<option>Autor do gol</option>
<option>Chute no gol</option>
<option>Chute de fora da área no gol</option>
<option>Cabeceio no gol</option>
<option>Escanteios</option>
<option>Cartões</option>
<option>Cartão de jogador</option>
<option>Finalizações</option>

</select>

<label>Odd disponível</label>

<input
    id="odd"
    type="number"
    min="1.01"
    step="0.01"
    placeholder="Ex: 2.00"
>

</div>


<!-- CONTEXTO -->

<div class="card">

<h2>🧠 Contexto da partida</h2>

<div class="grid">

<div>

<label>Minuto</label>

<input
    id="minuto"
    type="number"
    min="0"
    max="130"
    placeholder="Ex: 35"
>

</div>

<div>

<label>Placar</label>

<input
    id="placar"
    type="text"
    placeholder="Ex: 1-0"
>

</div>

</div>


<label>Momento</label>

<select id="momento">

<option value="pre">
Pré-jogo
</option>

<option value="live">
LIVE
</option>

</select>

</div>


<!-- ESTATÍSTICAS -->

<div class="card">

<h2>📊 Estatísticas</h2>

<p class="info">
Preencha somente os dados que você realmente possui.
Campos vazios não serão tratados como dados.
</p>

<div>

<input
