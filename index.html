.vazio {

.risco {

.info {

/* =========================
   TESTE DA API
========================= */

async function testarAPI() {

    const status =
        document.getElementById("status");

    try {

        const resposta =
            await fetch("/api");

        const dados =
            await resposta.json();

        if (
            resposta.ok &&
            dados.status === "online"
        ) {

            status.innerText =
                "● API conectada";

        } else {

            status.innerText =
                "● API respondeu com erro";

        }

    } catch (erro) {

        status.innerText =
            "● API offline";

    }

}
