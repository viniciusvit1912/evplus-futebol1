<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV+ Teste</title>

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
}

.card {
    max-width: 500px;
    margin: auto;
    background: #151d26;
    padding: 20px;
    border-radius: 15px;
}

h1 {
    color: #00ff88;
    text-align: center;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 8px 0 15px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #0b0f14;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 8px;
    background: #00ff88;
    font-weight: bold;
    font-size: 16px;
}

#resultado {
    margin-top: 20px;
    padding: 15px;
    line-height: 1.8;
}
</style>
</head>

<body>

<div class="card">

<h1>⚽ EV+ FUTEBOL</h1>

<p>Teste do motor de cálculo</p>

<label>Probabilidade (%)</label>

<input
    id="probabilidade"
    type="number"
    placeholder="Ex: 60"
>

<label>Odd</label>

<input
    id="odd"
    type="number"
    step="0.01"
    placeholder="Ex: 2.00"
>

<button id="calcular">
🧮 CALCULAR EV
</button>

<div id="resultado">
Aguardando dados...
</div>

</div>

<script>

document
.getElementById("calcular")
.addEventListener("click", async function() {

    const resultado =
        document.getElementById("resultado");

    const probabilidade =
        Number(
            document.getElementById("probabilidade").value
        );

    const odd =
        Number(
            document.getElementById("odd").value
        );

    if (!probabilidade || !odd) {

        resultado.innerHTML =
            "⚠️ Preencha os dois campos.";

        return;
    }

    resultado.innerHTML =
        "⏳ Calculando...";

    try {

        const resposta = await fetch("/api", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                probabilidade: probabilidade,
                odd: odd
            })

        });

        const dados =
            await resposta.json();

        if (!resposta.ok) {

            resultado.innerHTML =
                "❌ Erro: " +
                (dados.mensagem || "API");

            return;
        }

        resultado.innerHTML =

            "✅ Cálculo realizado!<br><br>" +

            "Probabilidade: <strong>" +
            dados.probabilidade +
            "%</strong><br>" +

            "Odd: <strong>" +
            dados.odd +
            "</strong><br>" +

            "EV: <strong>" +
            dados.ev +
            "%</strong><br>" +

            "Odd justa: <strong>" +
            dados.valor_justo +
            "</strong>";

    } catch (erro) {

        resultado.innerHTML =
            "❌ Falha na comunicação com a API.";

    }

});

</script>

</body>
</html>
