<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV+ Futebol</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
        }

        header {
            padding: 20px;
            background: #111820;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #00ff88;
        }

        .container {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: #151d26;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 8px 0 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0b0f14;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            background: #00ff88;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        .resultado {
            font-size: 18px;
            line-height: 1.7;
        }

        .positivo {
            color: #00ff88;
            font-weight: bold;
        }

        .negativo {
            color: #ff5555;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>⚽ EV+ FUTEBOL</h1>
    <p>Calculadora de Valor Esperado</p>
</header>

<div class="container">

    <div class="card">

        <h2>🎯 Calcular EV</h2>

        <label>Probabilidade estimada (%)</label>

        <input
            id="probabilidade"
            type="number"
            min="0"
            max="100"
            step="0.1"
            placeholder="Ex: 60"
        >

        <label>Odd</label>

        <input
            id="odd"
            type="number"
            min="1"
            step="0.01"
            placeholder="Ex: 2.00"
        >

        <button onclick="calcularEV()">
            🧮 CALCULAR EV
        </button>

    </div>

    <div class="card">

        <h2>📊 Resultado</h2>

        <div id="resultado" class="resultado">
            Informe a probabilidade e a odd.
        </div>

    </div>

</div>

<script>

async function calcularEV() {

    const probabilidade =
        parseFloat(document.getElementById("probabilidade").value);

    const odd =
        parseFloat(document.getElementById("odd").value);

    const resultado =
        document.getElementById("resultado");

    if (
        isNaN(probabilidade) ||
        isNaN(odd) ||
        probabilidade <= 0 ||
        probabilidade >= 100 ||
        odd <= 1
    ) {

        resultado.innerHTML =
            "⚠️ Informe uma probabilidade entre 0 e 100 e uma odd maior que 1.";

        return;
    }

    resultado.innerHTML = "⏳ Calculando...";

    try {

        const resposta = await fetch("/api", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                probabilidade: probabilidade,
                odd: odd
            })

        });

        if (!resposta.ok) {
            throw new Error("Erro na API");
        }

        const dados = await resposta.json();

        let classificacao;

        if (dados.ev > 0) {

            classificacao =
                `<span class="positivo">🟢 VALOR POSITIVO</span>`;

        } else {

            classificacao =
                `<span class="negativo">🔴 VALOR NEGATIVO</span>`;

        }

        resultado.innerHTML = `
            Probabilidade: <strong>${dados.probabilidade}%</strong><br>
            Odd: <strong>${dados.odd}</strong><br>
            EV: <strong>${dados.ev}%</strong><br>
            Odd justa: <strong>${dados.valor_justo}</strong><br><br>
            ${classificacao}
        `;

    } catch (erro) {

        resultado.innerHTML =
            "❌ Não foi possível calcular. Verifique a API.";

    }
}

</script>

</body>
</html>
