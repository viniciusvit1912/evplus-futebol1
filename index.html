<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV+ Futebol</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
        }

        header {
            padding: 20px;
            background: #111820;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #00ff88;
        }

        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: #151d26;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .status {
            color: #00ff88;
            font-weight: bold;
        }

        button {
            background: #00ff88;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>⚽ EV+ FUTEBOL</h1>
    <p>Dashboard de análise</p>
</header>

<div class="container">

    <div class="card">
        <h2>📊 Status do sistema</h2>
        <p class="status">● Sistema online</p>
    </div>

    <div class="card">
        <h2>🎯 Jogos analisados</h2>
        <p id="jogos">0 jogos</p>
    </div>

    <div class="card">
        <h2>🚨 Alertas</h2>
        <p id="alertas">Nenhum alerta no momento.</p>
    </div>

    <button onclick="atualizar()">
        Atualizar dados
    </button>

</div>

<script>
function atualizar() {
    document.getElementById("jogos").innerText =
        "Sistema preparado para analisar jogos";

    document.getElementById("alertas").innerText =
        "Aguardando dados das partidas...";
}
</script>

</body>
</html>
