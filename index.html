<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV+ Futebol</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
}

header {
    padding: 22px;
    text-align: center;
    background: #111820;
}

h1 {
    color: #00ff88;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #151d26;
    padding: 20px;
    margin-bottom: 18px;
    border-radius: 14px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 8px 0 15px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #0b0f14;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 8px;
    background: #00ff88;
    font-weight: bold;
    font-size: 16px;
}

#resultado {
    line-height: 1.8;
}
</style>
</head>

<body>

<header>
<h1>⚽ EV+ FUTEBOL</h1>
<p>Motor de análise</p>
</header>

<div class="container">

<div class="card">

<h2>🎯 Nova análise</h2>

<input id="casa" placeholder="Time da casa">

<input id="visitante" placeholder="Time visitante">

<input id="mercado" placeholder="Mercado">

<input id="probabilidade" type="number" placeholder="Probabilidade (%)">

<input id="odd" type="number" step="0.01" placeholder="Odd">

<button id="analisar">🎯 ANALISAR PARTIDA</button>

</div>

<div class="card">

<h2>📊 Resultado</h2>

<div id="resultado">
Preencha os dados e toque em analisar.
</div>

</div>

</div>

<script>

document.getElementById("analisar").addEventListener("click", async function() {

    const resultado = document.getElementById("resultado");

    resultado.innerHTML = "⏳ Analisando...";

    const probabilidade = Number(
        document.getElementById("probabilidade").value
    );

    const odd = Number(
        document.getElementById("odd").value
    );

    if (!probabilidade || !odd) {
        resultado.innerHTML =
            "⚠️ Informe a probabilidade e a odd.";
        return;
    }

    try {

        const resposta = await fetch("/api", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                probabilidade: probabilidade,
                odd: odd
            })
        });

        const dados = await resposta.json();

        resultado.innerHTML =
            "✅ API respondeu!<br><br>" +
            "Probabilidade: " + dados.probabilidade + "%<br>" +
            "Odd: " + dados.odd + "<br>" +
            "EV: " + dados.ev + "%<br>" +
            "Odd justa: " + dados.valor_justo;

    } catch (erro) {

        resultado.innerHTML =
            "❌ Erro ao conectar com a API.";

    }

});

</script>

</body>
</html>
