<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV+ Futebol</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
        }

        header {
            padding: 20px;
            background: #111820;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #00ff88;
        }

        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: #151d26;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .status {
            color: #00ff88;
            font-weight: bold;
        }

        button {
            background: #00ff88;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>⚽ EV+ FUTEBOL</h1>
    <p>Dashboard de análise</p>
</header>

<div class="container">

    <div class="card">
        <h2>📊 Status do sistema</h2>
        <p class="status">● Sistema online</p>
    </div>

    <div class="card">
        <h2>🎯 Jogos analisados</h2>
        <p id="jogos">0 jogos</p>
    </div>

    <div class="card">
        <h2>🚨 Alertas</h2>
        <p id="alertas">Nenhum alerta no momento.</p>
    </div>

    <button id="botao" onclick="atualizar()">
        🔄 Atualizar dados
    </button>

</div>

<script>
async function atualizar() {

    const botao = document.getElementById("botao");
    const jogos = document.getElementById("jogos");
    const alertas = document.getElementById("alertas");

    botao.innerText = "⏳ Conectando...";
    jogos.innerText = "Consultando API...";
    alertas.innerText = "Aguardando resposta do motor EV+...";

    try {

        const resposta = await fetch("/api");

        if (!resposta.ok) {
            throw new Error("API respondeu com erro");
        }

        const dados = await resposta.json();

        jogos.innerText = "API conectada com sucesso!";

        alertas.innerText =
            dados.mensagem || "Motor EV+ funcionando.";

        botao.innerText = "✅ Dados atualizados";

    } catch (erro) {

        jogos.innerText = "Erro ao conectar com a API.";

        alertas.innerText =
            "Não foi possível consultar o motor EV+.";

        botao.innerText = "🔄 Tentar novamente";
    }
}
</script>

</body>
</html>
