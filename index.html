<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EV+ Futebol</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0f14;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    background: #111820;
    padding: 24px 16px;
    text-align: center;
    border-bottom: 1px solid #202a34;
}

header h1 {
    margin: 0;
    color: #00ff88;
    font-size: 28px;
}

header p {
    color: #999;
    margin: 8px 0 0;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 16px;
}

.card {
    background: #151d26;
    border: 1px solid #202a34;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin: 12px 0 6px;
    color: #aaa;
}

input,
select {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #394550;
    background: #0b0f14;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: 0;
    border-radius: 10px;
    background: #00ff88;
    color: #06110b;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.status {
    font-weight: bold;
    color: #ffd166;
}

.online {
    color: #00ff88;
}

.error {
    color: #ff5555;
}

.resultado {
    line-height: 1.9;
}

.positivo {
    color: #00ff88;
    font-weight: bold;
}

.negativo {
    color: #ff5555;
    font-weight: bold;
}

.aguarda {
    color: #ffd166;
    font-weight: bold;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<header>
    <h1>⚽ EV+ FUTEBOL</h1>
    <p>Professional Strategic Betting Analyst</p>
</header>

<div class="container">

    <div class="card">
        <h2>📡 Sistema</h2>

        <div id="status" class="status">
            ● Verificando API...
        </div>
    </div>

    <div class="card">

        <h2>⚽ Análise EV+</h2>

        <label for="casa">
            Time da casa
        </label>

        <input
            id="casa"
            type="text"
            placeholder="Ex: Flamengo"
        >

        <label for="visitante">
            Time visitante
        </label>

        <input
            id="visitante"
            type="text"
            placeholder="Ex: Palmeiras"
        >

        <label for="mercado">
            Mercado
        </label>

        <select id="mercado">

            <option value="">
                Selecione
            </option>

            <option value="Resultado">
                Resultado
            </option>

            <option value="Over/Under gols">
                Over/Under gols
            </option>

            <option value="Ambas marcam">
                Ambas marcam
            </option>

            <option value="Autor do gol">
                Autor do gol
            </option>

            <option value="Chute no gol">
                Chute no gol
            </option>

            <option value="Chute de fora da área no gol">
                Chute de fora da área no gol
            </option>

            <option value="Cabeceio no gol">
                Cabeceio no gol
            </option>

            <option value="Escanteios">
                Escanteios
            </option>

            <option value="Cartões">
                Cartões
            </option>

            <option value="Finalizações">
                Finalizações
            </option>

        </select>

        <label for="odd">
            Odd disponível
        </label>

        <input
            id="odd"
            type="number"
            min="1.01"
            step="0.01"
            placeholder="Ex: 2.00"
        >

        <label for="probabilidade">
            Probabilidade estimada (%)
        </label>

        <input
            id="probabilidade"
            type="number"
            min="0.1"
            max="100"
            step="0.1"
            placeholder="Ex: 55"
        >

        <label for="momento">
            Momento
        </label>

        <select id="momento">

            <option value="pre">
                Pré-jogo
            </option>

            <option value="live">
                LIVE
            </option>

        </select>

        <button
            id="analisar"
            type="button"
        >
            🎯 ANALISAR EV
        </button>

    </div>

    <div class="card">

        <h2>📈 Veredito</h2>

        <div
            id="resultado"
            class="resultado"
        >
            Aguardando análise.
        </div>

    </div>

</div>

<script>

async function testarAPI() {

    const status =
        document.getElementById("status");

    try {

        const resposta =
            await fetch("/api", {
                method: "GET",
                cache: "no-store"
            });

        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " +
                resposta.status
            );

        }

        const dados =
            await resposta.json();

        if (
            dados.status === "online"
        ) {

            status.className =
                "status online";

            status.textContent =
                "● API funcionando";

        } else {

            throw new Error(
                "Resposta inesperada da API."
            );

        }

    } catch (erro) {

        status.className =
            "status error";

        status.textContent =
            "● API não conectada";

        console.error(erro);

    }
}


async function analisarEV() {

    const resultado =
        document.getElementById(
            "resultado"
        );

    const odd =
        Number(
            document.getElementById(
                "odd"
            ).value
        );

    const probabilidade =
        Number(
            document.getElementById(
                "probabilidade"
            ).value
        );

    const momento =
        document.getElementById(
            "momento"
        ).value;


    if (
        !Number.isFinite(odd) ||
        odd <= 1
    ) {

        resultado.innerHTML =
            '<span class="negativo">' +
            'Informe uma odd válida.' +
            '</span>';

        return;
    }


    if (
        !Number.isFinite(probabilidade) ||
        probabilidade <= 0 ||
        probabilidade > 100
    ) {

        resultado.innerHTML =
            '<span class="negativo">' +
            'Informe uma probabilidade entre 0 e 100.' +
            '</span>';

        return;
    }


    resultado.innerHTML =
        "⏳ Calculando...";


    try {

        const resposta =
            await fetch("/api", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    probabilidade:
                        probabilidade,

                    odd:
                        odd,

                    momento:
                        momento

                })

            });


        const dados =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                dados.mensagem ||
                "Erro na API"
            );

        }


        let classe =
            "aguarda";


        if (
            dados.decisao ===
            "ENTRA"
        ) {

            classe =
                "positivo";

        } else if (
            dados.decisao ===
            "PASSA"
        ) {

            classe =
                "negativo";

        }


        const simbolo =
            dados.decisao === "ENTRA"
                ? "🟢"
                : dados.decisao === "PASSA"
                ? "🔴"
                : "🟡";


        resultado.innerHTML =

            "<strong>Decisão:</strong> " +

            '<span class="' +
            classe +
            '">' +

            simbolo +
            " " +
            dados.decisao +

            "</span><br><br>" +

            "<strong>Odd:</strong> " +
            Number(dados.odd).toFixed(2) +

            "<br>" +

            "<strong>Probabilidade estimada:</strong> " +
            Number(
                dados.probabilidade_estimada
            ).toFixed(2) +
            "%" +

            "<br>" +

            "<strong>Probabilidade implícita:</strong> " +
            Number(
                dados.probabilidade_implicita
            ).toFixed(2) +
            "%" +

            "<br>" +

            "<strong>EV:</strong> " +
            Number(
                dados.ev
            ).toFixed(2) +
            "%" +

            "<br>" +

            "<strong>Odd justa:</strong> " +
            Number(
                dados.odd_justa
            ).toFixed(2) +

            "<br>" +

            "<strong>Classificação:</strong> " +
            dados.classificacao +

            "<br>" +

            "<strong>Banca:</strong> R$ " +
            Number(
                dados.banca
            ).toFixed(2) +

            "<br>" +

            "<strong>Stake recomendada:</strong> R$ " +
            Number(
                dados.stake_recomendada
            ).toFixed(2);


    } catch (erro) {

        resultado.innerHTML =
            '<span class="negativo">' +
            "Erro ao consultar API: " +
            erro.message +
            "</span>";

    }

}


document
    .getElementById("analisar")
    .addEventListener(
        "click",
        analisarEV
    );


testarAPI();

</script>

</body>
</html>
