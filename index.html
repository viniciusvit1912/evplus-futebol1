<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EV+ Futebol</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0f14;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #111820;
    padding: 24px 16px;
    text-align: center;
    border-bottom: 1px solid #202a34;
}

header h1 {
    margin: 0;
    color: #00ff88;
    font-size: 28px;
}

header p {
    color: #999;
    margin: 8px 0 0;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 16px;
}

.card {
    background: #151d26;
    border: 1px solid #202a34;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin: 12px 0 6px;
    color: #aaa;
}

input,
select {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #394550;
    background: #0b0f14;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: 0;
    border-radius: 10px;
    background: #00ff88;
    color: #06110b;
    font-size: 17px;
    font-weight: bold;
}

.status {
    font-weight: bold;
    color: #ffd166;
}

.online {
    color: #00ff88;
}

.error {
    color: #ff5555;
}

.resultado {
    line-height: 1.8;
}

.positivo {
    color: #00ff88;
    font-weight: bold;
}

.negativo {
    color: #ff5555;
    font-weight: bold;
}

.aguarda {
    color: #ffd166;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.info {
    color: #999;
    font-size: 13px;
}

@media (max-width: 600px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>⚽ EV+ FUTEBOL</h1>
    <p>Professional Strategic Betting Analyst</p>
</header>

<div class="container">

    <div class="card">
        <h2>📡 Sistema</h2>

        <div id="status" class="status">
            ● Verificando API...
        </div>
    </div>

    <div class="card">

        <h2>⚽ Análise EV+</h2>

        <label>Time da casa</label>
        <input id="casa" placeholder="Ex: Flamengo">

        <label>Time visitante</label>
        <input id="visitante" placeholder="Ex: Palmeiras">

        <label>Mercado</label>

        <select id="mercado">
            <option value="">Selecione</option>
            <option>Resultado</option>
            <option>Over/Under gols</option>
            <option>Ambas marcam</option>
            <option>Autor do gol</option>
            <option>Chute no gol</option>
            <option>Chute de fora da área no gol</option>
            <option>Cabeceio no gol</option>
            <option>Escanteios</option>
            <option>Cartões</option>
            <option>Finalizações</option>
        </select>

        <label>Odd</label>
        <input
            id="odd"
            type="number"
            min="1.01"
            step="0.01"
            placeholder="Ex: 2.00"
        >

        <label>Probabilidade estimada (%)</label>
        <input
            id="probabilidade"
            type="number"
            min="0.1"
            max="100"
            step="0.1"
            placeholder="Ex: 55"
        >

        <button id="analisar">
            🎯 ANALISAR EV
        </button>

    </div>

    <div class="card">

        <h2>📈 Veredito</h2>

        <div id="resultado" class="resultado">
            Aguardando análise.
        </div>

    </div>

</div>

<script>

async function testarAPI() {

    const status =
        document.getElementById("status");

    try {

        const resposta =
            await fetch("/api", {
                method: "GET",
                cache: "no-store"
            });

        if (!resposta.ok) {
            throw new Error(
                "Erro HTTP " + resposta.status
            );
        }

        const dados =
            await resposta.json();

        if (dados.status === "online") {

            status.className =
                "status online";

            status.textContent =
                "● API funcionando";

        } else {

            throw new Error(
                "API respondeu de forma inesperada."
            );
        }

    } catch (erro) {

        status.className =
            "status error";

        status.textContent =
            "● API não conectada";

        console.error(erro);
    }
}


async function analisarEV() {

    const resultado =
        document.getElementById("resultado");

    const odd =
        Number(
            document.getElementById("odd").value
        );

    const probabilidade =
        Number(
            document.getElementById(
                "probabilidade"
            ).value
        );

    if (
        !Number.isFinite(odd) ||
        odd <= 1
    ) {

        resultado.innerHTML =
            '<span class="negativo">' +
            'Informe uma odd válida.' +
            '</span>';

        return;
    }

    if (
        !Number.isFinite(probabilidade) ||
        probabilidade <= 0 ||
        probabilidade > 100
    ) {

        resultado.innerHTML =
            '<span class="negativo">' +
            'Informe uma probabilidade entre 0 e 100.' +
            '</span>';

        return;
    }

    resultado.innerHTML =
        "⏳ Calculando...";

    try {

        const resposta =
            await fetch("/api", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    probabilidade:
                        probabilidade,

                    odd:
                        odd
                })
            });

        const dados =
            await resposta.json();

        if (!resposta.ok) {

            throw new Error(
                dados.mensagem ||
                "Erro na API"
            );
        }

        let decisao;
        let classe;

        if (dados.ev > 5) {

            decisao =
                "🟢 ENTRA";

            classe =
                "positivo";

        } else if (dados.ev >= 0) {

            decisao =
                "🟡 AGUARDA";

            classe =
                "aguarda";

        } else {

            decisao =
                "🔴 PASSA";

            classe =
                "negativo";
        }

        const implicita =
            (1 / odd) * 100;

        resultado.innerHTML =

            "<strong>Decisão:</strong> " +
            '<span class="' +
            classe +
            '">' +
            decisao +
            "</span><br><br>" +

            "<strong>Odd:</strong> " +
            odd.toFixed(2) +
            "<br>" +

            "<strong>Probabilidade estimada:</strong> " +
            probabilidade.toFixed(2) +
            "%<br>" +

            "<strong>Probabilidade implícita:</strong> " +
            implicita.toFixed(2) +
            "%<br>" +

            "<strong>EV:</strong> " +
            dados.ev.toFixed(2) +
            "%<br>" +

            "<strong>Odd justa:</strong> " +
            dados.valor_justo;

    } catch (erro) {

        resultado.innerHTML =
            '<span class="negativo">' +
            "Erro ao consultar API: " +
            erro.message +
            "</span>";
    }
}


document
    .getElementById("analisar")
    .addEventListener(
        "click",
        analisarEV
    );


testarAPI();

</script>

</body>
</html>
